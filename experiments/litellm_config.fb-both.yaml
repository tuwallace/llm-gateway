  cache: true
  cache_params:
    type: redis-semantic
    host: localhost
    port: 6380
    password: os.environ/REDIS_PASSWORD
    similarity_threshold: 0.9
    redis_semantic_cache_embedding_model: ollama-embed
    ttl: 600
