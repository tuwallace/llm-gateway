  routing_strategy: simple-shuffle
  num_retries: 3
  allowed_fails: 1
  cooldown_time: 30
  enable_health_check_routing: true
  fallbacks:
  - my-educational-model:
    - my-fallback-model
general_settings:
  database_url: os.environ/DATABASE_URL
